[package]
name = "setllend-tests"
version = "0.1.0"
description = "near-workspaces sandbox tests for the Setllend contract"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
near-workspaces = { workspace = true }
serde_json = { workspace = true }
# OnceCell, to build each wasm once per test binary.
tokio = { workspace = true, features = ["sync"] }
# Signing intents payloads like a wallet (ERC-191, NEP-413) for the mock's execute_intents.
base64 = "0.22"
bs58 = "0.5"
ed25519-dalek = "2.2"
secp256k1 = { version = "0.27", features = ["recovery"] }
sha2 = "0.10"
sha3 = "0.10"

[dev-dependencies]
tokio = { workspace = true }
