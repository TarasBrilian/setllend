[workspace]
resolver = "3"
members = ["setllend", "mocks/intents", "mocks/oracle", "tests"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/TarasBrilian/setllend"

[workspace.dependencies]
near-sdk = "5.30.0"
near-workspaces = { version = "0.24.0", features = ["unstable"] }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# `cfg(near)` is set by near-sdk when building for wasm.
[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
